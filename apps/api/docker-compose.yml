services:
  postgres:
    image: postgres:16-alpine
    container_name: appq-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: appq
      POSTGRES_PASSWORD: appq
      POSTGRES_DB: appq
    volumes:
      - appq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appq -d appq']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  appq_pg_data:
